<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4efe7;color:#14181d;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:48px 24px;">
      <p style="margin:0 0 24px;color:#c64f24;font-size:12px;font-weight:700;letter-spacing:2px;">SHIPSHAPE 90</p>
      <h1 style="margin:0 0 12px;font-size:32px;line-height:1.1;">Your sign-in code</h1>
      <p style="margin:0 0 28px;color:#58616b;font-size:16px;line-height:1.5;">Enter this six-digit code in the app. It expires in one hour and can only be used once.</p>
      <div style="padding:22px;border:1px solid #d8d0c4;border-radius:16px;background:#ffffff;text-align:center;font-size:36px;font-weight:800;letter-spacing:10px;">{{ .Token }}</div>
      <p style="margin:28px 0 0;color:#7c848c;font-size:13px;line-height:1.5;">If you did not request this code, you can safely ignore this email.</p>
    </div>
  </body>
</html>
